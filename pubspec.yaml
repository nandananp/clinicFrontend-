name: clinic_app
description: "Clinic Management & Electronic Medical Record application."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  connectivity_plus: ^7.3.2
  flutter_dotenv: ^6.0.1
  google_fonts: ^6.3.2
  data_table_2: ^2.5.15
  reactive_forms: ^18.2.2
  dropdown_search: ^6.0.2
  toastification: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env