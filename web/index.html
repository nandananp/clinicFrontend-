
<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hospital Clinic Management Application">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clinic Management">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Clinic Management</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5F7F9;
      z-index: 99999;
      font-family: Arial, sans-serif;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #app-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .medical-logo {
      width: 76px;
      height: 76px;
      background: #369D96;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(54, 157, 150, 0.2);
      animation: pulse 1.8s infinite;
    }

    .medical-logo svg {
      width: 42px;
      height: 42px;
      fill: white;
    }

    .app-title {
      margin-top: 25px;
      font-size: 23px;
      font-weight: 700;
      color: #123D50;
      letter-spacing: 0.5px;
    }

    .app-subtitle {
      margin-top: 7px;
      font-size: 13px;
      color: #7A8992;
    }

    .loader-spinner {
      width: 34px;
      height: 34px;
      margin-top: 32px;
      border: 3px solid #DCEBE9;
      border-top: 3px solid #369D96;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 13px;
      font-size: 12px;
      color: #7A8992;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }
  </style>
</head>

<body>

  <!-- Hospital Application Loader -->
  <div id="app-loader">

    <div class="medical-logo">
      <svg viewBox="0 0 24 24">
        <path d="M19 8h-3V5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v3H5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h3v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3h3a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1zm-1 6h-5v5h-2v-5H6v-2h5V7h2v5h5z"/>
      </svg>
    </div>

    <div class="app-title">
      Clinic Management
    </div>

    <div class="app-subtitle">
      Hospital & Healthcare Management System
    </div>

    <div class="loader-spinner"></div>

    <div class="loading-text">
      Preparing your workspace...
    </div>

  </div>

  <!-- Flutter Application -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Remove loader after Flutter renders first frame -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loader');

      if (loader) {
        loader.classList.add('hidden');

        setTimeout(() => {
          loader.remove();
        }, 500);
      }
    });
  </script>

</body>
</html>
